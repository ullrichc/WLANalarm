  #   options:
  #     server: "https://ntfy.sh"
  #     topic: "wlanalarm-bitte-hier-etwas-langes-zufaelliges"

  # - type: "webhook"
  #   name: "Home Assistant"
  #   min_level: "armed_motion"
  #   options:
  #     url: "http://homeassistant.local:8123/api/webhook/wlanalarm"

  # - type: "smtp"
  #   name: "E-Mail"
  #   min_level: "alarm"
  #   options:
  #     host: "smtp.example.org"
  #     port: 587
  #     from: "alarm@example.org"
  #     to: ["ich@example.org"]
  #     password: "${env:SMTP_PASSWORD}"

  # Legt in Home Assistant automatisch einen Bewegungsmelder und eine
  # Alarmanlage an. Benötigt: pip install -e ".[mqtt]"
  # - type: "mqtt"
  #   name: "MQTT"
  #   min_level: "motion"
  #   options:
  #     host: "192.168.178.20"
  #     port: 1883
  #     username: "wlanalarm"
  #     password: "${env:MQTT_PASSWORD}"
  #     topic_prefix: "wlanalarm"
  #     discovery: true

storage:
  directory: "./state"
  event_retention_days: 90
  record_samples: false      # true schreibt alle Rohmesswerte mit
  sample_retention_days: 3

web:
  enabled: true
  # Auf 0.0.0.0 nur zusammen mit einem Token - sonst kann jedes Gerät im
  # Heimnetz die Anlage entschärfen. Die Konfiguration erzwingt das.
  host: "127.0.0.1"
  port: 8723
  token: ""

log_level: "INFO"
